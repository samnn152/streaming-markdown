name: Selection Integration

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'lib/src/render/**'
      - 'test/render/**'
      - 'example/integration_test/selection_engine_test.dart'
      - 'example/test_driver/integration_test.dart'
      - '.github/workflows/selection-integration.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'lib/src/render/**'
      - 'test/render/**'
      - 'example/integration_test/selection_engine_test.dart'
      - 'example/test_driver/integration_test.dart'
      - '.github/workflows/selection-integration.yml'

jobs:
  desktop:
    name: ${{ matrix.target }} selection
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
          - os: windows-latest
            target: windows
          - os: macos-latest
            target: macos
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev

      - name: Install example dependencies
        working-directory: example
        run: flutter pub get

      - name: Run Linux selection integration
        if: runner.os == 'Linux'
        working-directory: example
        run: xvfb-run -a flutter test integration_test/selection_engine_test.dart -d linux

      - name: Run desktop selection integration
        if: runner.os != 'Linux'
        working-directory: example
        run: flutter test integration_test/selection_engine_test.dart -d ${{ matrix.target }}

  chrome:
    name: Chrome selection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup matching ChromeDriver
        uses: nanasess/setup-chromedriver@v2

      - name: Install example dependencies
        working-directory: example
        run: flutter pub get

      - name: Start ChromeDriver
        run: chromedriver --port=4444 &

      - name: Run browser selection integration
        working-directory: example
        run: >-
          flutter drive
          -d web-server
          --web-port 7357
          --browser-name chrome
          --driver test_driver/integration_test.dart
          --target integration_test/selection_engine_test.dart

  android:
    name: Android selection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install example dependencies
        working-directory: example
        run: flutter pub get

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android selection integration
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          script: cd example && flutter test integration_test/selection_engine_test.dart -d emulator-5554

  ios:
    name: iOS selection
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install example dependencies
        working-directory: example
        run: flutter pub get

      - name: Boot an available iPhone simulator
        id: simulator
        shell: bash
        run: |
          device_id="$(xcrun simctl list devices available \
            | awk -F '[()]' '/iPhone/ {print $2; exit}')"
          test -n "$device_id"
          xcrun simctl boot "$device_id" || true
          xcrun simctl bootstatus "$device_id" -b
          echo "device_id=$device_id" >> "$GITHUB_OUTPUT"

      - name: Run iOS selection integration
        working-directory: example
        run: >-
          flutter test integration_test/selection_engine_test.dart
          -d ${{ steps.simulator.outputs.device_id }}
