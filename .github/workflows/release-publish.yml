name: Release and Publish

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write
  id-token: write

jobs:
  compatibility:
    name: Flutter 3.10.7 compatibility
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Flutter 3.10.7
        shell: bash
        run: |
          git clone --depth 1 --branch 3.10.7 \
            https://github.com/flutter/flutter.git \
            "$RUNNER_TEMP/flutter-3.10.7"
          echo "$RUNNER_TEMP/flutter-3.10.7/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter-3.10.7/bin/flutter" --version

      - name: Install package dependencies
        run: flutter pub get --no-example

      - name: Analyze package
        run: dart analyze

      - name: Run package tests
        env:
          SKIP_GOLDENS: 'true'
        run: flutter test

      - name: Run selection tests in Chrome
        run: >-
          flutter test --platform chrome
          test/render/selection_components_test.dart
          test/render/selection_controller_test.dart
          test/render/selection_scroll_visual_test.dart
          test/render/selection_textfield_reference_test.dart

      - name: Build Flutter web example
        working-directory: example
        run: flutter build web

  test:
    name: Test tagged release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install package dependencies
        run: flutter pub get

      - name: Verify committed WASM parser assets
        run: bash tool/verify_wasm_assets.sh

      - name: Analyze package
        run: dart analyze lib test

      - name: Run render tests
        run: flutter test

      - name: Run selection tests in Chrome
        run: >-
          flutter test --platform chrome
          test/render/selection_components_test.dart
          test/render/selection_controller_test.dart
          test/render/selection_scroll_visual_test.dart
          test/render/selection_textfield_reference_test.dart

      - name: Build Flutter web example
        working-directory: example
        run: flutter build web

      - name: Verify Flutter WebAssembly build
        working-directory: example
        run: flutter build web --wasm

      - name: Validate package
        run: flutter pub publish --dry-run

  selection-integration:
    name: Selection platform matrix
    uses: ./.github/workflows/selection-integration.yml

  release:
    name: Create GitHub release
    needs:
      - compatibility
      - test
      - selection-integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes

  publish:
    name: Publish to pub.dev
    needs:
      - compatibility
      - test
      - selection-integration
    permissions:
      contents: read
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
