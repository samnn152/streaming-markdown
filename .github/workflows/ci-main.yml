name: Main CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  compatibility:
    name: Flutter 3.10.7 compatibility
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Flutter 3.10.7
        shell: bash
        run: |
          git clone --depth 1 --branch 3.10.7 \
            https://github.com/flutter/flutter.git \
            "$RUNNER_TEMP/flutter-3.10.7"
          echo "$RUNNER_TEMP/flutter-3.10.7/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter-3.10.7/bin/flutter" --version

      - name: Install package dependencies
        run: flutter pub get

      - name: Verify committed WASM parser assets
        run: bash tool/verify_wasm_assets.sh

      - name: Analyze package
        run: dart analyze

      - name: Run package tests
        env:
          SKIP_GOLDENS: 'true'
        run: flutter test

      - name: Run selection tests in Chrome
        run: >-
          flutter test --platform chrome
          test/render/selection_components_test.dart
          test/render/selection_controller_test.dart
          test/render/selection_scroll_visual_test.dart
          test/render/selection_textfield_reference_test.dart

      - name: Build Flutter web example
        working-directory: example
        run: flutter build web

  test:
    name: Analyze and test package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install package dependencies
        run: flutter pub get

      - name: Verify committed WASM parser assets
        run: bash tool/verify_wasm_assets.sh

      - name: Analyze package
        run: dart analyze

      - name: Run render tests
        run: flutter test

      - name: Run selection tests in Chrome
        run: >-
          flutter test --platform chrome
          test/render/selection_components_test.dart
          test/render/selection_controller_test.dart
          test/render/selection_scroll_visual_test.dart
          test/render/selection_textfield_reference_test.dart

  docs:
    name: Build docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Build embedded Flutter web demo
        working-directory: example
        run: flutter build web --base-href /demo/chat/ --output ../website/static/demo/chat

      - name: Install docs dependencies
        working-directory: website
        run: npm ci

      - name: Build docs
        working-directory: website
        run: npm run build
