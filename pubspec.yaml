name: animated_streaming_markdown
description: "Flutter markdown streaming package for Android/iOS/macOS/Linux/Windows/web, with Tree-sitter WASM and KaTeX math support."
version: 0.3.7
homepage: https://samnn.dev
repository: https://github.com/samnn152/streaming-markdown
issue_tracker: https://github.com/samnn152/streaming-markdown/issues
documentation: https://samnn.dev
topics:
  - markdown
  - streaming
  - flutter
  - animation
  - tree-sitter

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  collection: '>=1.17.0 <2.0.0'
  ffi: '>=2.0.1 <3.0.0'
  flutter_svg: '>=2.0.0+1 <3.0.0'
  html: '>=0.15.0 <0.16.0'
  tuple: '>=2.0.1 <3.0.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: '>=2.0.0 <7.0.0'

flutter:
  assets:
    - assets/wasm/
  fonts:
    - family: KaTeX_Main
      fonts:
        - asset: assets/fonts/katex/KaTeX_Main-Regular.ttf
        - asset: assets/fonts/katex/KaTeX_Main-Italic.ttf
          style: italic
        - asset: assets/fonts/katex/KaTeX_Main-Bold.ttf
          weight: 700
        - asset: assets/fonts/katex/KaTeX_Main-BoldItalic.ttf
          weight: 700
          style: italic
    - family: KaTeX_Math
      fonts:
        - asset: assets/fonts/katex/KaTeX_Math-Italic.ttf
        - asset: assets/fonts/katex/KaTeX_Math-BoldItalic.ttf
          weight: 700
    - family: KaTeX_AMS
      fonts:
        - asset: assets/fonts/katex/KaTeX_AMS-Regular.ttf
    - family: KaTeX_Caligraphic
      fonts:
        - asset: assets/fonts/katex/KaTeX_Caligraphic-Regular.ttf
        - asset: assets/fonts/katex/KaTeX_Caligraphic-Bold.ttf
          weight: 700
    - family: KaTeX_Fraktur
      fonts:
        - asset: assets/fonts/katex/KaTeX_Fraktur-Regular.ttf
        - asset: assets/fonts/katex/KaTeX_Fraktur-Bold.ttf
          weight: 700
    - family: KaTeX_SansSerif
      fonts:
        - asset: assets/fonts/katex/KaTeX_SansSerif-Regular.ttf
        - asset: assets/fonts/katex/KaTeX_SansSerif-Bold.ttf
          weight: 700
        - asset: assets/fonts/katex/KaTeX_SansSerif-Italic.ttf
          style: italic
    - family: KaTeX_Script
      fonts:
        - asset: assets/fonts/katex/KaTeX_Script-Regular.ttf
    - family: KaTeX_Typewriter
      fonts:
        - asset: assets/fonts/katex/KaTeX_Typewriter-Regular.ttf
    - family: KaTeX_Size1
      fonts:
        - asset: assets/fonts/katex/KaTeX_Size1-Regular.ttf
    - family: KaTeX_Size2
      fonts:
        - asset: assets/fonts/katex/KaTeX_Size2-Regular.ttf
    - family: KaTeX_Size3
      fonts:
        - asset: assets/fonts/katex/KaTeX_Size3-Regular.ttf
    - family: KaTeX_Size4
      fonts:
        - asset: assets/fonts/katex/KaTeX_Size4-Regular.ttf
  plugin:
    platforms:
      android:
        ffiPlugin: true
        package: com.hider152.animated_streaming_markdown
        pluginClass: AnimatedStreamingMarkdownPlugin
      ios:
        ffiPlugin: true
        pluginClass: AnimatedStreamingMarkdownPlugin
      linux:
        ffiPlugin: true
        pluginClass: AnimatedStreamingMarkdownPlugin
      macos:
        ffiPlugin: true
        pluginClass: AnimatedStreamingMarkdownPlugin
      windows:
        ffiPlugin: true
        pluginClass: AnimatedStreamingMarkdownPlugin
